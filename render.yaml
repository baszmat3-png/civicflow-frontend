services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Prisma)
  # ----------------------------------------------------
  - type: web
    name: civicflow-backend
    env: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://civicflow-frontend-1-hoy9.onrender.com
      - key: WHATSAPP_PROVIDER
        value: wpsender
      - key: WHATSAPP_API_URL
        value: https://backendapi.wpsenderx.com/api/messages/send
      - key: WHATSAPP_API_KEY
        value: wps_7b5db2a829ff4377ad0c6c42ea7fe4af991c191992305e70eab136c8bb89f7d2
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "منظومة CivicFlow <no-reply@civicflow.gov>"

  # ----------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite + Tailwind)
  # ----------------------------------------------------
  - type: web
    name: civicflow-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://civicflow-backend-1u3o.onrender.com/api

# ------------------------------------------------------
# 3. PostgreSQL Database
# ------------------------------------------------------
databases:
  - name: civicflow-db
    databaseName: civicflow
    user: civicflow_user
    plan: free
    region: frankfurt
    ipAllowList: []
